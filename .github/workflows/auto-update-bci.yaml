name: Auto-Update SUSE BCI

# Tracks the bci-base digest pinned in v1.16-4.10/Dockerfile and opens one PR
# per drift. Rebuilding against the new base picks up OS-level security fixes.
# Same shape as the sibling forks' auto-update-bci workflows.

on:
  schedule:
    - cron: '13 12 * * *'  # Daily at 12:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: rancher-main

      - uses: docker/setup-buildx-action@v4

      - name: Get BCI digest
        id: bci
        run: |
          set -euo pipefail

          DOCKERFILE=v1.16-4.10/Dockerfile

          LATEST=$(docker buildx imagetools inspect \
                   registry.suse.com/bci/bci-base:latest \
                   --format '{{json .}}' | \
                   jq -r '.manifest.digest')

          if grep -qE "^FROM registry\.suse\.com/bci/bci-base@sha256:" "${DOCKERFILE}"; then
            CURRENT=$(grep -E "^FROM registry\.suse\.com/bci/bci-base" "${DOCKERFILE}" | head -1 \
                      | sed -nE 's|.*@(sha256:[a-f0-9]+).*|\1|p')
          else
            CURRENT="unpinned"
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile
        if: steps.bci.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          DIGEST="${{ steps.bci.outputs.latest }}"

          # Repin the base FROM line, preserving the trailing "AS base" stage name
          sed -i -E "s#(FROM registry\.suse\.com/bci/bci-base)(:latest|@sha256:[a-f0-9]+)?#\1@${DIGEST}#" \
            v1.16-4.10/Dockerfile

      - name: Create or update PR
        if: steps.bci.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.bci.outputs.latest }}
          CURRENT: ${{ steps.bci.outputs.current }}
        run: |
          set -euo pipefail

          BRANCH="auto-update-suse-bci"
          DATE=$(date -u +%Y-%m-%d)
          TITLE="chore: update SUSE BCI base image (${DATE})"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"

          git add v1.16-4.10/Dockerfile
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "${TITLE}"
          git push -f origin "${BRANCH}"

          cat > pr-body.md <<EOF
          ## Automated SUSE BCI Base Image Update

          - **Previous digest**: \`${CURRENT}\`
          - **New digest**: \`${LATEST}\`

          Rebuilding with the new base image picks up OS-level security fixes.

          ---
          🤖 Generated by [auto-update-bci](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          EXISTING=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" \
              --title "${TITLE}" \
              --body-file pr-body.md
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create \
              --title "${TITLE}" \
              --body-file pr-body.md \
              --base rancher-main \
              --head "${BRANCH}" \
              --label "dependencies" \
              --label "automated" \
              --label "suse-bci-update"
          fi
