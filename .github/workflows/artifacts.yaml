name: Artifacts

# Single build+push pipeline for the SUSE (bci-base) image of v1.16-4.10.
# Builds base/filters/full from v1.16-4.10/Dockerfile and pushes
# :v1.16-4.10-{base,filters,full}-suse tags. The -suse suffix documents the
# base-image lineage and is what the rancher-logging chart consumes; it is
# retained now that the Alpine track is retired. PR build-only is handled by
# ci.yaml. After the `full` build, dispatches `image-updated` to ob-team-charts.

on:
  push:
    branches:
      - rancher-main   # Our fork's main branch
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  container-images:
    name: Container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fluentd:
          - version: v1.16-4.10
        image-type:
          - base
          - filters
          - full

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gather metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fluentd
          flavor: |
            latest = false
          tags: |
            type=raw,value=${{ matrix.fluentd.version }}-${{ matrix.image-type }}-suse
            type=raw,value=${{ matrix.fluentd.version }}-${{ matrix.image-type }}-suse-build.${{ github.run_number }}
            type=sha,prefix=${{ matrix.fluentd.version }}-${{ matrix.image-type }}-suse-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
        if: github.event_name == 'push'

      - name: Build and push (${{ matrix.image-type }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.fluentd.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=suse-${{ matrix.image-type }}
          cache-to: type=gha,mode=max,scope=suse-${{ matrix.image-type }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ matrix.image-type }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/fluentd:${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}"
          format: "sarif"
          output: "trivy-results.sarif"
        if: github.event_name == 'push'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
        if: github.event_name == 'push'

      - name: Dispatch to ob-team-charts
        if: github.event_name == 'push' && matrix.image-type == 'full'
        env:
          CHARTS_DISPATCH_TOKEN: ${{ secrets.CHARTS_DISPATCH_TOKEN }}
        run: |
          TAG="${{ matrix.fluentd.version }}-${{ matrix.image-type }}-suse"
          curl -s -X POST \
            -H "Authorization: Bearer ${CHARTS_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/manno/ob-team-charts/dispatches \
            -d "{\"event_type\":\"image-updated\",\"client_payload\":{\"component\":\"fluentd\",\"tag\":\"${TAG}\"}}"
